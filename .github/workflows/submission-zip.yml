name: Build submission ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  verify-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.12.6'

      - name: Cache Julia packages
        uses: julia-actions/cache@v2

      - name: Instantiate tutorial and Pluto tool environments
        run: |
          julia --project=. -e 'using Pkg; Pkg.instantiate()'
          julia --project=tools -e 'using Pkg; Pkg.instantiate()'

      - name: Test teaching code and numerical invariants
        run: julia --project=. test/runtests.jl

      - name: Rebuild deterministic and static teaching artifacts
        run: julia scripts/rebuild_all.jl --no-pdf

      - name: Verify public HTML exports
        shell: bash
        run: |
          test -s html/00_Primer.html
          test -s html/01_OneObjectManyCoordinates.html
          test -s html/02_GeometryAtlas.html
          test -s html/03_OptimizationFailureMuseum.html
          test -s html/04_NeuralRepresentations.html
          test -s html/05_ExerciseSheet.html
          test -s html/GlossaryAppendix.html
          test -s slides/TensorKitchen_Interactive_Intro_Deck.html

      - name: Reject stale deterministic generated text
        shell: bash
        run: |
          # Pluto HTML state is intentionally excluded from byte-level comparison.
          # PDFs are committed reviewer fallbacks and are built separately/local,
          # not inside this deterministic verification and ZIP job.
          git diff --exit-code -- . \
            ':(exclude)**/*.html' \
            ':(exclude)**/*.pdf' \
            ':(exclude)dist/**'

      - name: Build submission ZIP
        run: julia scripts/build_release.jl

      - name: Verify submission ZIP structure
        run: |
          unzip -tq dist/LowRankStructureIsGeometry-public.zip
          test -n "$(unzip -Z1 dist/LowRankStructureIsGeometry-public.zip | grep '^LowRankStructureIsGeometry-public/README.md$')"
          test -z "$(unzip -Z1 dist/LowRankStructureIsGeometry-public.zip | grep -E '(^|/)(dist|\.git)(/|$)|DEPLOYMENT\.md$' || true)"

      - name: Upload submission artifact
        uses: actions/upload-artifact@v4
        with:
          name: LowRankStructureIsGeometry-submission
          path: dist/LowRankStructureIsGeometry-public.zip
          if-no-files-found: error
          retention-days: 30
